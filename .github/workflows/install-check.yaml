# Weekly canary. Installs the course exactly as a learner does, from the
# published R-universe, and fails if anything on that path has broken.
#
# This exists because gradethis moved R-universe accounts in September 2026
# and nothing noticed: the old server stayed up, R reported the unrelated
# "not available for this version of R", and the first anyone knew of it was
# a clinician unable to start the course. R-CMD-check did not catch it,
# because CI resolves dependencies its own way rather than a learner's way.
on:
  schedule:
    # Mondays, early, so a breakage is found before the week's teaching.
    - cron: "0 7 * * 1"
  workflow_dispatch:

name: install-check

jobs:
  install-check:
    # Learners are on managed Windows; test where they live.
    runs-on: windows-latest
    name: Install as a learner

    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Step 2 of the guide - install the course
        shell: Rscript {0}
        run: |
          install.packages("r4clinstats",
                           repos = c("https://apsmunro.r-universe.dev",
                                     CRAN = "https://cloud.r-project.org"),
                           dependencies = TRUE)
          if (!requireNamespace("r4clinstats", quietly = TRUE)) {
            stop("r4clinstats did not install from apsmunro.r-universe.dev")
          }
          cat("installed r4clinstats", format(packageVersion("r4clinstats")), "\n")

      - name: Step 3 of the guide - check_setup() fetches gradethis
        shell: Rscript {0}
        run: |
          library(r4clinstats)
          ok <- check_setup(install = TRUE)
          if (!isTRUE(ok)) {
            stop("check_setup() reported a problem; see its output above")
          }

      - name: Confirm the grader and the lesson engine are really there
        shell: Rscript {0}
        run: |
          for (p in c("gradethis", "learnr")) {
            if (!requireNamespace(p, quietly = TRUE)) {
              stop(p, " is missing after a clean learner install")
            }
            cat(p, format(packageVersion(p)), "OK\n")
          }

      # The rstudio R-universe also serves development builds of learnr and
      # rmarkdown. Learners must end up on the CRAN releases; if a dev build
      # leaks in through the install path, fail here rather than let a cohort
      # run the course on an unreleased engine.
      - name: No development builds leaked in
        shell: Rscript {0}
        run: |
          cran <- available.packages(repos = c(CRAN = "https://cloud.r-project.org"))
          bad <- character()
          for (p in c("learnr", "rmarkdown")) {
            if (!requireNamespace(p, quietly = TRUE)) next
            have <- packageVersion(p)
            want <- package_version(cran[p, "Version"])
            cat(sprintf("%s installed=%s CRAN=%s\n", p, have, want))
            if (have > want) bad <- c(bad, sprintf("%s %s is ahead of CRAN %s", p, have, want))
          }
          if (length(bad)) {
            stop("development build leaked into a learner install:\n  ",
                 paste(bad, collapse = "\n  "))
          }
