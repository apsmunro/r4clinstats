# Starting-point CI. Builds the datasets, then runs R CMD check (which runs the
# testthat harness). Tutorials that need gradethis are exercised by the harness
# only where it is installed; gradethis is not on CRAN and comes from the
# rstudio R-universe, named in extra-repositories below (Additional_repositories
# in DESCRIPTION is read by R CMD check, not by the dependency solver).
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Monthly, against whatever CRAN serves that day, so a breaking tidyverse
    # release surfaces here rather than in a learner's session.
    - cron: "0 6 1 * *"

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: R-CMD-check (${{ matrix.config.os }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest}
          # Learners are on managed Windows; test where they live.
          - {os: windows-latest}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://rstudio.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::usethis
          needs: check

      - name: Build datasets
        run: |
          source("data-raw/patients.R")
          source("data-raw/labs.R")
          source("data-raw/outcomes.R")
          source("data-raw/linelist.R")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
